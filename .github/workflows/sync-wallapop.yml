# Sincroniza src/data/cars.generated.json desde el perfil público de Wallapop.
#
# - Cadencia: 1 vez por hora (GitHub no garantiza nada más fino que 5 min, y
#   cada 5 min es innecesario para un stock de coches) + disparo manual:
#   Actions → Run workflow.
# - La petición la hace un Cloudflare Worker (código en
#   experiments/wallapop-proxy): los runners salen por EE. UU. y Wallapop les
#   responde 403, mientras que desde Madrid responde 200. Secretos del repo:
#   WALLAPOP_BASE (URL del Worker) y WALLAPOP_BASE_TOKEN.
# - Solo descarga fichas de anuncios nuevos o modificados.
# - Solo commitea si el inventario difiere (git diff como gate) → Vercel no
#   redespliega si no hay novedades (siempre con build + smoke antes).
# - Tras publicar en `integracion`, sube `main` (push fast-forward) para que
#   producción (Vercel) reciba el inventario nuevo. Si `main` llega a divergir
#   a mano, el push falla, la Action avisa por email y se arregla uniendo ramas.
# - Si el script falla (Wallapop caído, 0 anuncios, cambios en la página):
#   la Action falla, la web se queda en el último snapshot y GitHub envía un
#   email de aviso al dueño del repositorio.
name: Sincronizar stock con Wallapop

on:
  schedule:
    # Cada 30 min, en los minutos 13 y 43: los cron de la hora en punto (y :30)
    # se retrasan por congestión en GitHub. Coste 0 (Actions es gratis en
    # repos públicos; el Worker usa ~0,1 % de las 100.000 req/día del free tier).
    - cron: "13,43 * * * *"
  workflow_dispatch: # disparo manual desde la pestaña Actions

# Nunca dos sincronizaciones a la vez
concurrency:
  group: sync-wallapop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integracion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Si falta el secreto, el script caería al fetch directo desde la IP del
      # runner y fallaría con un 403 confuso. Mejor avisar aquí y claro.
      - name: Comprobar secretos de la pasarela
        env:
          WALLAPOP_BASE: ${{ secrets.WALLAPOP_BASE }}
          WALLAPOP_BASE_TOKEN: ${{ secrets.WALLAPOP_BASE_TOKEN }}
        run: |
          if [ -z "$WALLAPOP_BASE" ] || [ -z "$WALLAPOP_BASE_TOKEN" ]; then
            echo "::error::Faltan los secretos WALLAPOP_BASE y/o WALLAPOP_BASE_TOKEN (ver experiments/wallapop-proxy/README.md)."
            exit 1
          fi

      - name: Sincronizar con Wallapop
        env:
          WALLAPOP_BASE: ${{ secrets.WALLAPOP_BASE }}
          WALLAPOP_BASE_TOKEN: ${{ secrets.WALLAPOP_BASE_TOKEN }}
        run: node scripts/sync-wallapop.mjs

      - name: Comprobar si hay cambios
        id: diff
        run: |
          if git diff --quiet -- src/data/cars.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Inventario sin cambios: no se hace nada más."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Inventario actualizado: validando antes de publicar."
          fi

      - name: Instalar dependencias y validar (build + smoke)
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run build
          npm run smoke

      - name: Commit y push en integracion
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # El commit va ANTES del pull: cars.generated.json está modificado sin
          # registrar y `pull --rebase` se niega a trabajar así (fallaba con
          # "cannot pull with rebase: You have unstaged changes").
          git add src/data/cars.generated.json
          git commit -m "feat: sincronizar stock desde Wallapop ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin integracion
          git push origin HEAD:integracion

      - name: Publicar en main (produccion Vercel)
        if: steps.diff.outputs.changed == 'true'
        run: git push origin HEAD:main
